[workspace]
members = [
    "crates/panini-core",
    "crates/panini-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Stephane Denis <stephane@panini.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stephanedenis/Panini-FS"
homepage = "https://github.com/stephanedenis/Panini-FS"
documentation = "https://github.com/stephanedenis/Panini-FS"
keywords = ["panini", "knowledge-graph", "git-native"]
categories = ["database-implementations", "science"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing and crypto
sha2 = "0.10"
blake3 = "1.5"

# Git operations
git2 = "0.19"

# Storage & indexing
rocksdb = "0.24"
lru = "0.12"
tantivy = "0.22"

# Markdown & parsing
pulldown-cmark = "0.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
walkdir = "2.5"
glob = "0.3"
regex = "1.10"
once_cell = "1.19"
lazy_static = "1.4"

# Collections and data structures
bytes = "1.5"
byteorder = "1.5"

# HTTP types
http = "1.0"

# Graph data structures
petgraph = "0.6"

# Web framework (panini-api)
axum = { version = "0.7", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Async traits
async-trait = "0.1"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Language detection
whatlang = "0.16"

# Configuration
config = "0.14"
toml = "0.8"

# Testing
tempfile = "3.8"
criterion = "0.5"
pretty_assertions = "1.4"
proptest = "1.5"
